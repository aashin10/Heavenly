<div class="job-card">
  <div class="job-header">
    <div class="job-info">
      <div class="job-title-row">
        <h4 class="job-title">{{ job.title }}</h4>
        <app-status-badge [status]="job.status" [showIcon]="true" />
      </div>
      <div class="company-name">
        <app-icon name="building-2" [size]="16" />
        <span>{{ job.company }}</span>
      </div>
    </div>
    <div class="domain-badge">{{ job.domain }}</div>
  </div>

  <div class="job-meta">
    <div class="meta-item">
      <app-icon name="map-pin" [size]="16" />
      <span>{{ job.location }}</span>
    </div>
    <div class="meta-item">
      <app-icon name="briefcase" [size]="16" />
      <span>{{ job.type }}</span>
    </div>
    <div class="meta-item">
      <app-icon name="indian-rupee" [size]="16" />
      <span>{{ job.salary }}</span>
    </div>
    <div class="meta-item">
      <app-icon name="calendar" [size]="16" />
      <span>{{ formatDate(job.postedDate) }}</span>
    </div>
  </div>

  @if (showDetails()) {
    <div class="job-details">
      <div class="detail-section">
        <h5 class="detail-title">Description</h5>
        <p class="detail-text">{{ job.description }}</p>
      </div>
      <div class="detail-section">
        <h5 class="detail-title">Requirements</h5>
        <p class="detail-text">{{ job.requirements }}</p>
      </div>
    </div>
  }

  <div class="job-actions">
    <button class="btn-outline" (click)="toggleDetails()">
      {{ showDetails() ? 'Hide Details' : 'View Details' }}
    </button>
    @if (showActions) {
      <button class="btn-primary" (click)="handleApply()">
        Apply Now
      </button>
    }
  </div>
</div>
