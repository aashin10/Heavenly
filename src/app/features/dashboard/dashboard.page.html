<div class="dashboard-page">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="header-container">
      <h1 class="header-title">Dashboard</h1>
      <p class="header-subtitle">{{ headerSubtitle() }}</p>
    </div>
  </div>

  <!-- Admin Tab Navigation -->
  @if (isAdmin()) {
    <div class="tab-navigation">
      <div class="tab-container">
        <button
          class="tab-button"
          [class.active]="activeTab() === 'jobseeker'"
          (click)="setActiveTab('jobseeker')"
        >
          <app-icon name="search" [size]="20" />
          <span>Find Jobs</span>
        </button>
        <button
          class="tab-button"
          [class.active]="activeTab() === 'employer'"
          (click)="setActiveTab('employer')"
        >
          <app-icon name="briefcase" [size]="20" />
          <span>Post Jobs</span>
        </button>
      </div>
    </div>
  }

  <!-- Dashboard Content -->
  <div class="dashboard-content">
    @if (isAdmin()) {
      @if (activeTab() === 'employer') {
        <app-employer-dashboard />
      } @else {
        <app-job-seeker-dashboard />
      }
    } @else if (showEmployerDashboard()) {
      <app-employer-dashboard />
    } @else {
      <app-job-seeker-dashboard />
    }
  </div>
</div>
